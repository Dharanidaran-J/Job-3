<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChallengeHire – Prove Your Skills. Unlock Your Career.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1537;--navy2:#1a2150;--pur:#7c5cff;--pur2:#ede9ff;--bg:#f5f6fb;--card:#fff;--tx:#1b1f3b;--mu:#6b7194;--bd:#e3e5f1;--ok:#14a05f;--warn:#c98a00;--bad:#d64545}
*{box-sizing:border-box;margin:0}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
a{color:var(--pur);text-decoration:none}button,input,select,textarea{font:inherit}
nav{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:12px 5vw;flex-wrap:wrap}
nav .logo{font-weight:800;font-size:20px;color:#fff;margin-right:auto}nav .logo b{color:#a994ff}
nav a.l{color:#cfd3f5;font-size:14px;padding:4px 2px}nav a.l:hover,nav a.l.on{color:#fff;border-bottom:2px solid var(--pur)}
.btn{background:var(--pur);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:700;cursor:pointer;display:inline-block;font-size:14px}
.btn:hover{background:#6847f0}.btn.ghost{background:transparent;border:1.5px solid var(--pur);color:var(--pur)}
.btn.w{background:#fff;color:var(--navy)}.btn.sm{padding:5px 11px;font-size:12px}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.alert{background:#fde8e8;color:#9b1c1c;font-size:13px;text-align:center;padding:6px 12px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:80px 5vw 70px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.1;font-weight:800;max-width:800px}.hero p{max-width:620px;color:#c9cdf0;margin:18px 0 28px;font-size:18px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
main{padding:32px 5vw;max-width:1200px;margin:auto}section{margin-bottom:44px}h2{font-size:24px;margin-bottom:6px}h3{font-size:17px}
.sub{color:var(--mu);margin-bottom:18px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(15,21,55,.05)}
.card.h{display:flex;flex-direction:column;gap:8px}.card.h .btn{margin-top:auto;align-self:flex-start}
.tag{display:inline-block;background:var(--pur2);color:#5a3fe0;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 3px 2px 0;font-weight:500}
.tag.g{background:#e0f6ea;color:#0d7a46}.tag.r{background:#fde8e8;color:var(--bad)}.tag.y{background:#fff3d0;color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{font-size:30px;display:block;color:var(--navy)}.stat span{color:var(--mu);font-size:13px}
.bar{background:var(--pur2);border-radius:9px;height:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pur),#a994ff);transition:width .6s}
.mu{color:var(--mu);font-size:13px}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea{border:1.5px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid var(--pur);border-color:transparent}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 4px}.fl input,.fl select{width:auto;flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-size:12px}
.wrap{overflow-x:auto}.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.steps{counter-reset:s}.steps .card{position:relative;padding-top:46px}.steps .card:before{counter-increment:s;content:counter(s);position:absolute;top:12px;left:16px;background:var(--pur);color:#fff;width:26px;height:26px;border-radius:50%;text-align:center;font-weight:700;line-height:26px;font-size:13px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:80vw}#toast.s{opacity:1}#toast.e{background:var(--bad)}
footer{background:var(--navy);color:#aab0dd;padding:28px 5vw;font-size:14px;display:flex;gap:20px;flex-wrap:wrap}footer b{color:#fff;margin-right:auto}footer a{color:#cfd3f5}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--bd);background:#fff;border-radius:99px;padding:6px 16px;cursor:pointer;font-weight:500}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pre{white-space:pre-wrap}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="nav"></nav><div class="alert" id="banner" role="alert" hidden></div>
<div id="app"></div>
<footer><b>ChallengeHire</b><a href="#/about">About</a><a href="#/about">Contact</a><a href="#/about">Privacy</a></footer>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=new Date().toISOString().slice(0,10),inDays=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const ST=['Applied','Assessment Pending','Under Review','Shortlisted','Rejected','Selected'];
const API=window.API_BASE||'';let db={users:[],jobs:[],challenges:[],apps:[],subs:[],stats:{}},me=null,ready=0;
const banner=m=>{const b=$('#banner');b.hidden=!m;b.textContent=m||''};
async function api(path,method='GET',body){let r,d={};
 try{r=await fetch(API+path,{method,credentials:'include',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}
 catch(e){const m='Cannot reach the backend server. Start it with "python app.py" and reload this page.';banner(m);throw new Error(m)}
 try{d=await r.json()}catch(e){}
 if(!r.ok){const m=d.error||'The server returned an unexpected response (HTTP '+r.status+'). Make sure the Flask backend is serving this page.';if(r.status>=500||!d.error)banner(m);throw new Error(m)}
 return d}
async function load(){const d=await api('/api/bootstrap');db=d.db;me=d.me;banner('')}
const by=(a,i)=>db[a].find(x=>x.id===i);
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='s'+(e?' e':'');clearTimeout(t.t);t.t=setTimeout(()=>t.className='',2600)};
const go=h=>location.hash=h,U=()=>me&&by('users',me),tags=(a,c='')=>a.map(x=>`<span class="tag ${c}">${esc(x)}</span>`).join('');
const norm=a=>a.map(s=>s.toLowerCase());
function match(user,job){const have=norm(user.skills||[]),m=job.skills.filter(s=>have.includes(s.toLowerCase())),x=job.skills.filter(s=>!have.includes(s.toLowerCase()));return{pct:Math.round(m.length/job.skills.length*100),m,x}}
function recChallenges(u){const have=norm(u.skills),done=db.subs.filter(s=>s.student===u.id).map(s=>s.ch);
return db.challenges.filter(c=>!done.includes(c.id)).map(c=>{const gap=c.skills.filter(s=>!have.includes(s.toLowerCase())),ov=c.skills.length-gap.length;const why=gap.length?`Practises ${gap.join(', ')} (skills you lack)`:'Reinforces skills you already list';return{c,why,sc:gap.length*2+ov}}).sort((a,b)=>b.sc-a.sc).slice(0,3)}
const bestScore=(sid,chid)=>{const s=db.subs.filter(x=>x.student===sid&&x.ch===chid&&x.score!=null);return s.length?Math.max(...s.map(x=>x.score)):null};
function nav(){const u=U(),h=location.hash;const l=(p,t)=>`<a class="l ${h===p?'on':''}" href="${p}">${t}</a>`;
$('#nav').innerHTML=`<a class="logo" href="#/">Challenge<b>Hire</b></a>${l('#/','Home')}${l('#/jobs','Jobs')}${l('#/challenges','Challenges')}${u?l('#/dash','Dashboard')+`<span class="mu" style="color:#aab0dd">${esc(u.name)}</span><button class="btn sm ghost" style="color:#fff" onclick="logout()">Log out</button>`:`<a class="btn sm" href="#/login">Log in</a>`}`}
async function act(fn,ok){try{await fn();await load();if(ok)toast(ok);route()}catch(e){toast(e.message,'e')}}
const form=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
async function logout(){await act(()=>api('/api/logout','POST'),'Logged out');go('#/')}
async function doLogin(e){const f=form(e);await act(()=>api('/api/login','POST',f),'Logged in');if(me)go('#/dash')}
async function reg(e){const f=form(e);await act(()=>api('/api/register','POST',f),'Account created');if(me)go('#/dash')}
function applyJob(id){if(!U())return go('#/login');return act(()=>api(`/api/jobs/${id}/apply`,'POST'),'Application submitted')}
function submitCh(e,id){const f=form(e);return act(()=>api(`/api/challenges/${id}/submit`,'POST',f),'Submission saved')}
function saveProfile(e){const f=form(e);return act(()=>api('/api/profile','POST',f),'Profile updated')}
function postJob(e){const f=form(e);return act(()=>api('/api/jobs','POST',f),'Job posted')}
function postCh(e){const f=form(e);return act(()=>api('/api/challenges','POST',f),'Challenge created')}
const toggleJob=id=>act(()=>api(`/api/jobs/${id}/toggle`,'POST'),'Job updated');
const setStatus=(id,status)=>act(()=>api(`/api/applications/${id}/status`,'POST',{status}),'Status set to '+status);
function grade(e,id){const f=form(e);return act(()=>api(`/api/submissions/${id}/grade`,'POST',{score:f.score,feedback:f.fb}),'Evaluation saved')}
const dl=d=>d<today?'<span class="tag r">Closed</span>':`<span class="mu">Due ${d}</span>`;
function jobCard(j,u){const m=u&&u.role==='student'?match(u,j):null;return`<div class="card h"><div class="flex sp"><h3>${esc(j.title)}</h3>${m?`<span class="tag ${m.pct>=60?'g':'y'}">${m.pct}% match</span>`:''}</div><div class="mu">${esc(j.company)} · ${esc(j.loc)} · ${esc(j.type)}</div><div>${tags(j.skills)}</div><div class="mu">${j.salary?esc(j.salary)+' · ':''}${dl(j.deadline)}${j.open?'':' <span class="tag r">Closed</span>'}</div><a class="btn sm" href="#/job/${j.id}">View details</a></div>`}
function chCard(c){return`<div class="card h"><div class="flex sp"><h3>${esc(c.title)}</h3><span class="tag ${c.diff==='Easy'?'g':c.diff==='Hard'?'r':'y'}">${c.diff}</span></div><div>${tags(c.skills)}</div><p class="mu">${esc(c.statement.slice(0,110))}…</p><div class="mu">Max score ${c.max} · ${dl(c.deadline)}</div><a class="btn sm" href="#/challenge/${c.id}">Open challenge</a></div>`}
const P={};
P['']=()=>{const u=U();return`<div class="hero"><h1>Prove Your Skills. Unlock Your Career.</h1><p>ChallengeHire replaces resume guesswork with real-world challenges. Companies see what you can build, and you see how you measure up to each role.</p><div class="row"><a class="btn w" href="#/jobs">Explore Jobs</a><a class="btn" href="#/challenges">Start a Challenge</a><a class="btn ghost" style="color:#fff;border-color:#fff" href="#/login">Get Started</a></div></div><main>
<section><div class="stats"><div class="stat"><b>${db.jobs.filter(j=>j.open).length}</b><span>Open jobs</span></div><div class="stat"><b>${db.challenges.length}</b><span>Challenges</span></div><div class="stat"><b>${db.stats.students}</b><span>Students</span></div><div class="stat"><b>${db.stats.submissions}</b><span>Submissions</span></div></div><p class="mu" style="margin-top:8px">Counts are read from the MySQL database. Sample records are labelled demo data in the README.</p></section>
<section><h2>Featured jobs</h2><p class="sub">Each role can include a practical challenge.</p><div class="grid">${db.jobs.filter(j=>j.open).slice(0,3).map(j=>jobCard(j,u)).join('')}</div></section>
<section><h2>Popular challenges</h2><p class="sub">Build something real and get scored feedback.</p><div class="grid">${db.challenges.slice(0,3).map(chCard).join('')}</div></section>
<section><h2>How it works</h2><p class="sub">From sign-up to shortlist in four steps.</p><div class="grid steps"><div class="card"><h3>Create a profile</h3><p class="mu">List your skills and college.</p></div><div class="card"><h3>Apply to a job</h3><p class="mu">See your skill match and gaps first.</p></div><div class="card"><h3>Complete the challenge</h3><p class="mu">Submit a GitHub or demo link.</p></div><div class="card"><h3>Get reviewed</h3><p class="mu">Recruiters score your work and decide.</p></div></div></section>
<section class="two"><div class="card"><h3>For students</h3><p class="mu">Show practical ability, get feedback, and discover which skills to practise next.</p></div><div class="card"><h3>For recruiters</h3><p class="mu">Compare candidates by evidence. AI suggestions explain themselves, and you make every hiring decision.</p></div></section></main>`};
P.about=()=>`<main><h2>About ChallengeHire</h2><p class="sub">Skill-based recruitment platform built for a DBMS project.</p><div class="card"><p>Contact: hello@challengehire.example (placeholder). Privacy: accounts, jobs, applications and submissions are stored in the application MySQL database.</p></div></main>`;
P.login=()=>`<main><div class="two"><form class="card" onsubmit="doLogin(event)"><h2>Log in</h2><p class="sub">Use the email and password you registered with.</p><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><p style="margin-top:14px"><button class="btn">Log in</button></p></form>
<form class="card" onsubmit="reg(event)"><h2>Create an account</h2><label>Role</label><select name="role" onchange="document.querySelectorAll('.st').forEach(x=>x.hidden=this.value!=='student');document.querySelectorAll('.rc').forEach(x=>x.hidden=this.value==='student')"><option value="student">Student</option><option value="recruiter">Recruiter</option></select>
<label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password (min 8 characters)</label><input name="password" type="password" minlength="8" required>
<div class="st"><label>College name</label><input name="college"><label>Technical skills (comma separated)</label><input name="skills" placeholder="HTML, CSS, Python"></div>
<div class="rc" hidden><label>Company name</label><input name="company"></div><p style="margin-top:14px"><button class="btn">Register</button></p></form></div></main>`;
P.jobs=()=>{const u=U(),q=(window.jq||'').toLowerCase(),t=window.jt||'',jj=db.jobs.filter(j=>(!q||(j.title+j.company+j.skills.join()).toLowerCase().includes(q))&&(!t||j.type===t));
return`<main><h2>Browse jobs</h2><p class="sub">Search by title, company or skill.</p><div class="flex fl" style="margin-bottom:18px"><input id="jq" placeholder="Search…" value="${esc(window.jq||'')}" oninput="jq=this.value;rerender('jq')"><select onchange="jt=this.value;route()"><option value="">All types</option>${['Full-time','Internship','Contract'].map(x=>`<option ${t===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid">${jj.map(j=>jobCard(j,u)).join('')||'<p class="mu">No jobs match. Clear the filters to see all openings.</p>'}</div></main>`};
function rerender(id){route();const e=$('#'+id);if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
P.job=id=>{const j=by('jobs',id),u=U();if(!j)return P.nf();const m=u&&u.role==='student'?match(u,j):null,c=j.ch&&by('challenges',j.ch),ap=u&&db.apps.find(a=>a.job===id&&a.student===u.id);
return`<main><a href="#/jobs">← All jobs</a><div class="card" style="margin-top:12px"><h2>${esc(j.title)}</h2><p class="mu">${esc(j.company)} · ${esc(j.loc)} · ${esc(j.type)} · ${esc(j.level)} ${j.salary?'· '+esc(j.salary):''}</p><p style="margin:14px 0">${esc(j.desc)}</p><div>${tags(j.skills)}</div><p class="mu" style="margin:10px 0">${dl(j.deadline)}</p>
${m?`<div class="card" style="background:var(--bg);margin:12px 0"><b>Skill match: ${m.pct}%</b><div class="bar" style="margin:8px 0"><i style="width:${m.pct}%"></i></div>Matched: ${tags(m.m,'g')||'<span class="mu">none</span>'}<br>Missing: ${tags(m.x,'r')||'<span class="mu">none</span>'}${m.x.length?`<p class="mu">Skill gap suggestions: ${recChallenges({skills:u.skills}).filter(r=>r.c.skills.some(s=>m.x.includes(s))).map(r=>`<a href="#/challenge/${r.c.id}">${esc(r.c.title)}</a>`).join(', ')||'no matching challenge yet'}</p>`:''}</div>`:''}
${c?`<p>Linked challenge: <a href="#/challenge/${c.id}">${esc(c.title)}</a></p>`:''}
<p style="margin-top:12px">${ap?`<span class="tag y">${ap.status}</span>`:`<button class="btn" onclick="applyJob('${j.id}')">Apply now</button>`}</p></div></main>`};
P.challenges=()=>`<main><h2>Real-world challenges</h2><p class="sub">Practical tasks from hiring companies.</p><div class="grid">${db.challenges.map(chCard).join('')}</div></main>`;
P.challenge=id=>{const c=by('challenges',id),u=U();if(!c)return P.nf();const mine=u?db.subs.filter(s=>s.ch===id&&s.student===u.id):[];
return`<main><a href="#/challenges">← All challenges</a><div class="card" style="margin-top:12px"><div class="flex sp"><h2>${esc(c.title)}</h2><span class="tag y">${c.diff}</span></div><p style="margin:12px 0">${esc(c.statement)}</p>${tags(c.skills)}<p class="mu" style="margin-top:8px">Evaluation: ${esc(c.criteria)} · Max score ${c.max} · ${dl(c.deadline)}</p>${c.job?`<p class="mu">Related job: <a href="#/job/${c.job}">${esc(by('jobs',c.job).title)}</a></p>`:''}</div>
${u&&u.role==='student'?`<form class="card" style="margin-top:16px" onsubmit="submitCh(event,'${id}')"><h3>Submit your work</h3><label>GitHub or live demo link</label><input name="link" placeholder="https://github.com/you/project" required><label>Short explanation</label><textarea name="note" rows="3" maxlength="500"></textarea><p style="margin-top:12px"><button class="btn">Submit challenge</button></p></form>`:`<p class="mu" style="margin-top:14px">${u?'Recruiters cannot submit challenges.':'<a href="#/login">Log in as a student</a> to submit.'}</p>`}
${mine.length?`<div class="card" style="margin-top:16px"><h3>Your submissions</h3>${mine.map(s=>`<p><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.link)}</a><br>${s.score==null?'<span class="tag y">Awaiting review</span>':`<span class="tag g">${s.score}/${c.max}</span> ${esc(s.fb)}`} <span class="mu">${s.at}</span></p>`).join('')}</div>`:''}</main>`};
P.nf=()=>'<main><h2>Page not found</h2><a href="#/">Back to home</a></main>';
P.dash=()=>{const u=U();if(!u){go('#/login');return''}return u.role==='student'?stuDash(u):recDash(u)};
function stuDash(u){const apps=db.apps.filter(a=>a.student===u.id),subs=db.subs.filter(s=>s.student===u.id),rec=recChallenges(u),jr=db.jobs.filter(j=>j.open&&!apps.some(a=>a.job===j.id)).map(j=>({j,m:match(u,j)})).sort((a,b)=>b.m.pct-a.m.pct).slice(0,3),scored=subs.filter(s=>s.score!=null);
const lvl=sk=>{const r=scored.filter(s=>by('challenges',s.ch).skills.some(x=>x.toLowerCase()===sk.toLowerCase())).map(s=>s.score/by('challenges',s.ch).max*100);return r.length?Math.round(Math.max(...r)):25};
return`<main><h2>Welcome, ${esc(u.name)}</h2><p class="sub">${esc(u.college||'')}</p><div class="stats" style="margin-bottom:24px"><div class="stat"><b>${apps.length}</b><span>Applications</span></div><div class="stat"><b>${subs.length}</b><span>Submissions</span></div><div class="stat"><b>${scored.length?Math.round(scored.reduce((a,s)=>a+s.score/by('challenges',s.ch).max*100,0)/scored.length)+'%':'–'}</b><span>Average score</span></div><div class="stat"><b>${scored.filter(s=>s.score/by('challenges',s.ch).max>=.7).length}</b><span>Achievements (70%+)</span></div></div>
<div class="two"><div class="card"><h3>Skill profile</h3>${u.skills.map(s=>`<div class="flex sp mu" style="margin-top:8px"><span>${esc(s)}</span><span>${lvl(s)}%</span></div><div class="bar"><i style="width:${lvl(s)}%"></i></div>`).join('')||'<p class="mu">Add skills below.</p>'}
<form onsubmit="saveProfile(event)"><label>College</label><input name="college" value="${esc(u.college)}"><label>Skills (comma separated)</label><input name="skills" value="${esc(u.skills.join(', '))}"><p style="margin-top:10px"><button class="btn sm">Save profile</button></p></form></div>
<div class="card"><h3>AI-recommended challenges</h3><p class="mu">Rule-based and explainable, based on your skills and past submissions.</p>${rec.map(r=>`<p style="margin-top:10px"><a href="#/challenge/${r.c.id}"><b>${esc(r.c.title)}</b></a><br><span class="mu">Why: ${esc(r.why)}</span></p>`).join('')||'<p class="mu">You have completed every challenge.</p>'}<h3 style="margin-top:18px">Recommended jobs</h3>${jr.map(x=>`<p><a href="#/job/${x.j.id}">${esc(x.j.title)}</a> <span class="tag ${x.m.pct>=60?'g':'y'}">${x.m.pct}%</span></p>`).join('')}</div></div>
<section class="card" style="margin-top:18px"><h3>Applications</h3><div class="wrap"><table><tr><th>Job</th><th>Status</th><th>Applied</th></tr>${apps.map(a=>`<tr><td><a href="#/job/${a.job}">${esc(by('jobs',a.job).title)}</a></td><td><span class="tag ${a.status==='Rejected'?'r':a.status==='Applied'||a.status==='Under Review'||a.status==='Assessment Pending'?'y':'g'}">${a.status}</span></td><td>${a.at}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">No applications yet. Browse jobs to apply.</td></tr>'}</table></div></section>
<section class="card" style="margin-top:18px"><h3>Submission history and feedback</h3><div class="wrap"><table><tr><th>Challenge</th><th>Link</th><th>Result</th></tr>${subs.map(s=>`<tr><td>${esc(by('challenges',s.ch).title)}</td><td><a href="${esc(s.link)}" target="_blank" rel="noopener">Open</a></td><td>${s.score==null?'<span class="tag y">Awaiting review</span>':`<b>${s.score}/${by('challenges',s.ch).max}</b> ${esc(s.fb)}`}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">No submissions yet.</td></tr>'}</table></div></section></main>`}
window.rf={job:'',st:'',sort:'score'};
function recDash(u){const jobs=db.jobs.filter(j=>j.owner===u.id),jid=jobs.map(j=>j.id),chs=db.challenges.filter(c=>c.owner===u.id),cid=chs.map(c=>c.id);
let apps=db.apps.filter(a=>jid.includes(a.job)).map(a=>{const s=by('users',a.student),j=by('jobs',a.job);return{...a,s,j,m:match(s,j),sc:j.ch?bestScore(s.id,j.ch):null}});
if(rf.job)apps=apps.filter(a=>a.job===rf.job);if(rf.st)apps=apps.filter(a=>a.status===rf.st);
apps.sort((a,b)=>rf.sort==='match'?b.m.pct-a.m.pct:(b.sc??-1)-(a.sc??-1));
const subs=db.subs.filter(s=>cid.includes(s.ch)).slice().reverse(),all=db.apps.filter(a=>jid.includes(a.job));
const opts=a=>a.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
return`<main><h2>Recruiter dashboard</h2><p class="sub">${esc(u.company)}</p><div class="stats" style="margin-bottom:24px"><div class="stat"><b>${jobs.filter(j=>j.open).length}/${jobs.length}</b><span>Open / total jobs</span></div><div class="stat"><b>${all.length}</b><span>Applicants</span></div><div class="stat"><b>${all.filter(a=>['Applied','Assessment Pending','Under Review'].includes(a.status)).length}</b><span>Pending</span></div><div class="stat"><b>${subs.filter(s=>s.score!=null).length}</b><span>Assessments completed</span></div></div>
<section class="card"><h3>Applicants</h3><div class="flex fl" style="margin:10px 0"><select onchange="rf.job=this.value;route()"><option value="">All jobs</option>${jobs.map(j=>`<option value="${j.id}" ${rf.job===j.id?'selected':''}>${esc(j.title)}</option>`).join('')}</select><select onchange="rf.st=this.value;route()"><option value="">All statuses</option>${ST.map(s=>`<option ${rf.st===s?'selected':''}>${s}</option>`).join('')}</select><select onchange="rf.sort=this.value;route()"><option value="score">Sort: assessment score</option><option value="match" ${rf.sort==='match'?'selected':''}>Sort: skill match</option></select></div>
<div class="wrap"><table><tr><th>Candidate</th><th>Job</th><th>Skills</th><th>Match</th><th>Score</th><th>Status</th><th>Decision</th></tr>${apps.map(a=>`<tr><td>${esc(a.s.name)}<br><span class="mu">${esc(a.s.college||'')}</span></td><td>${esc(a.j.title)}</td><td>${tags(a.s.skills)}</td><td>${a.m.pct}%<br><span class="mu">Missing: ${esc(a.m.x.join(', ')||'none')}</span></td><td>${a.sc==null?'–':a.sc}</td><td><span class="tag y">${a.status}</span></td><td class="flex"><button class="btn sm ok" onclick="setStatus('${a.id}','Shortlisted')">Shortlist</button><button class="btn sm bad" onclick="setStatus('${a.id}','Rejected')">Reject</button><button class="btn sm" onclick="setStatus('${a.id}','Selected')">Select</button></td></tr>`).join('')||'<tr><td colspan=7 class="mu">No applicants match these filters.</td></tr>'}</table></div><p class="mu">Scores and matches are decision support only. You make the final call.</p></section>
<section class="card" style="margin-top:18px"><h3>Challenge submissions to review</h3>${subs.map(s=>{const c=by('challenges',s.ch),st=by('users',s.student);return`<div style="border-top:1px solid var(--bd);padding:12px 0"><b>${esc(st.name)}</b> on ${esc(c.title)} <span class="mu">${s.at}</span><br><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.link)}</a><p class="mu">${esc(s.note)}</p><form class="flex fl" onsubmit="grade(event,'${s.id}')"><input name="score" type="number" min="0" max="${c.max}" placeholder="Score /${c.max}" value="${s.score??''}" required><input name="fb" placeholder="Feedback" value="${esc(s.fb)}" style="flex:3"><button class="btn sm">Save evaluation</button></form></div>`}).join('')||'<p class="mu">No submissions yet.</p>'}</section>
<section class="card" style="margin-top:18px"><h3>Your jobs</h3>${jobs.map(j=>`<div class="flex sp" style="border-top:1px solid var(--bd);padding:8px 0"><span>${esc(j.title)} ${j.open?'':'<span class="tag r">Closed</span>'}</span><button class="btn sm ghost" onclick="toggleJob('${j.id}')">${j.open?'Close job':'Reopen job'}</button></div>`).join('')}</section>
<div class="two" style="margin-top:18px"><form class="card" onsubmit="postJob(event)"><h3>Post a job</h3><label>Title</label><input name="title" required><label>Description</label><textarea name="desc" rows="2" required></textarea><label>Required skills (comma separated)</label><input name="skills" required><div class="flex fl"><div><label>Level</label><input name="level" value="Fresher"></div><div><label>Type</label><select name="type"><option>Full-time</option><option>Internship</option><option>Contract</option></select></div></div><div class="flex fl"><div><label>Location</label><input name="loc" value="Remote"></div><div><label>Salary (optional)</label><input name="salary"></div></div><label>Deadline</label><input name="deadline" type="date" min="${today}" value="${inDays(30)}" required><label>Challenge</label><select name="ch"><option value="">None</option>${opts(chs)}</select><p style="margin-top:12px"><button class="btn">Publish job</button></p></form>
<form class="card" onsubmit="postCh(event)"><h3>Create a challenge</h3><label>Title</label><input name="title" required><label>Problem statement</label><textarea name="statement" rows="3" required></textarea><label>Skills (comma separated)</label><input name="skills" required><div class="flex fl"><div><label>Difficulty</label><select name="diff"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div><div><label>Max score</label><input name="max" type="number" min="1" value="100"></div></div><label>Evaluation criteria</label><input name="criteria" required><label>Deadline</label><input name="deadline" type="date" min="${today}" value="${inDays(21)}" required><label>Related job</label><select name="job"><option value="">None</option>${opts(jobs)}</select><p style="margin-top:12px"><button class="btn">Create challenge</button></p></form></div></main>`}
function route(){if(!ready)return;const h=location.hash.replace('#/','').split('/'),f=P[h[0]]||P.nf;$('#app').innerHTML=f(h[1]);nav();if(!window._k)scrollTo(0,0)}
async function init(){$('#app').innerHTML='<main><p class="mu">Loading from the server…</p></main>';
 try{await load()}catch(e){$('#app').innerHTML=`<main><div class="card"><h2>Backend unavailable</h2><p>${esc(e.message)}</p><p style="margin-top:12px"><button class="btn" onclick="init()">Try again</button></p></div></main>`;nav();return}
 ready=1;route()}
addEventListener('hashchange',route);init();
</script></body></html>
